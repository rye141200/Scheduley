<div
  class="absolute inset-0 overflow-hidden bg-gradient-to-b from-blue-900 via-black to-purple-900 -z-10"
>
  <!-- Background animation -->
  <div class="stars-container">
    <div class="stars"></div>
  </div>
  <div class="shooting-star"></div>
</div>

<!-- Content perfectly centered in screen -->
<div class="fixed inset-0 flex items-center justify-center pointer-events-none">
  <div
    class="text-center px-6 max-w-xl backdrop-blur-md bg-white/5 rounded-xl p-8 shadow-2xl border border-white/10 pointer-events-auto"
  >
    <!-- big welcome -->
    <h1 class="text-6xl font-bold mb-8 text-white">
      Welcome{{ isLoggedIn() ? ", " + userName : "" }}!
    </h1>

    <!-- logged‑in message -->
    <p class="text-xl text-white mb-4" [hidden]="!isLoggedIn()">
      Great to see you back, {{ isLoggedIn() }}. Explore your dashboard below!
    </p>

    <!-- login prompt -->
    <div [hidden]="isLoggedIn()">
      <p class="text-xl text-white mb-6">
        You're not signed in. Please log in to continue.
      </p>
      <button
        (click)="onLogin()"
        class="px-6 py-2 bg-[#4080ff] text-white rounded-lg hover:bg-[#3070d0] transition-colors cursor-pointer"
      >
        Log In
      </button>
    </div>
    <div class="mt-6 flex justify-center space-x-4">
      <button
        (click)="onProtected()"
        class="px-6 py-2 bg-[#4080ff] text-white rounded-lg hover:bg-[#3070d0] transition-colors cursor-pointer"
      >
        Protected route!
      </button>
      <button
        (click)="onRefreshMe()"
        class="px-6 py-2 bg-[#4080ff] text-white rounded-lg hover:bg-[#3070d0] transition-colors cursor-pointer"
      >
        Refresh me!
      </button>
    </div>
  </div>
</div>
